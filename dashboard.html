<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC26 Group Standings</title>
<style>
  :root {
    --gold: #C9A24B;
    --gold-soft: rgba(201, 162, 75, 0.12);
    --radius: 10px;
    --maxw: 1440px;
  }
  [data-theme="dark"] {
    --bg: #0D0D0F;
    --surface: #161619;
    --surface-2: #1D1D21;
    --border: #2A2A30;
    --text: #F2F2F0;
    --text-dim: #8A8A92;
    --text-faint: #56565E;
  }
  [data-theme="light"] {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-2: #F3F3F0;
    --border: #E4E4DE;
    --text: #16161A;
    --text-dim: #6B6B72;
    --text-faint: #A0A09A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    font-weight: 700; font-size: 28px; 
  }
  .brand .mark b { color: var(--gold); }
  .brand .sub {
    font-size: 12px; text-transform: uppercase;
    color: var(--text-faint);
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .updated { font-size: 12px; color: var(--text-dim); }
  .toggle {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; display: grid; place-items: center; font-size: 16px;
    transition: border-color 0.2s, background 0.2s;
  }
  .toggle:hover { border-color: var(--gold); }
  .toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }


  /* Stats row */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin: 48px 0 24px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 20px;
  }
  .stat .label {
    font-size: 12px; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 10px;
  }
  .stat .num {
    font-weight: 800; font-size: 42px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat .unit { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* Section heads */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 12px 0 20px; gap: 16px;
  }
  .section-head h2 {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    font-weight: 700; font-size: 28px; text-transform: uppercase;
  }
  .exports { display: flex; gap: 8px; }
  .btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); font-family: inherit; font-size: 12px; font-weight: 600;
    text-transform: uppercase;
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
    transition: all 0.18s;
  }
  .btn:hover { color: var(--text); border-color: var(--gold); }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Groups grid */
  .groups {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 48px;
  }
  .group-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .group-card .gc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 16px 10px;
  }
  .group-card .gc-head .name {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; font-weight: 700;
    font-size: 16px; text-transform: uppercase;
  }
  .group-card .gc-head .tag {
    font-size: 12px; text-transform: uppercase;
    color: var(--text-faint);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th:not(.team-col), tbody td:not(.team-col) { width: 44px; }
  thead th {
    font-size: 12px; text-transform: uppercase;
    color: var(--text-faint); font-weight: 600; text-align: center;
    padding: 4px 4px; border-bottom: 1px solid var(--border);
  }
  thead th.team-col { text-align: left; padding-left: 16px; }
  tbody tr { height: 42px; }
  tbody td {
    font-size: 12px; text-align: center;
    font-variant-numeric: tabular-nums; color: var(--text-dim); vertical-align: middle;
  }
  tbody td.team-col {
    text-align: left; padding-left: 16px; color: var(--text); font-weight: 500;
  }
  tbody td.pts { color: var(--text); font-weight: 700; }
  tbody td .pos {
    display: inline-block; width: 16px; color: var(--text-faint);
    font-size: 10px;
  }
  /* Qualification: top 2 advance */
  tbody tr.qualified td.team-col .pos { color: var(--gold); }
  tbody tr.qualified td.team-col { color: var(--text); }
  tbody tr.cutline td { border-bottom: 2px solid var(--gold); }
  tbody tr.cutline td.team-col { position: relative; }

  /* Scorers */
  .scorers-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 48px;
  }
  .scorer-row {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .scorer-row:last-child { border-bottom: none; }
  .scorer-row .rank {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; font-weight: 700;
    font-size: 18px; color: var(--text-faint); font-variant-numeric: tabular-nums;
  }
  .scorer-row.lead .rank { color: var(--gold); }
  .scorer-row .who .nm { font-weight: 600; font-size: 15px; }
  .scorer-row .who .tm { font-size: 12px; color: var(--text-dim); }
  .scorer-row .goals {
    font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums;
  }
  .scorer-row.lead .goals { color: var(--gold); }

  footer {
    padding-bottom: 24px !important;
    color: var(--text-faint); font-size: 12px;
  }
  footer a { color: var(--text-dim); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--gold); }

  .loading { padding: 80px 0; text-align: center; color: var(--text-dim); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .groups { grid-template-columns: 1fr; }
  }
  @media (min-width: 721px) and (max-width: 1100px) {
    .groups { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <div class="brand">
      <span class="mark">World Cup 20<b>26</b></span>
      <span class="sub">Group Standings</span>
    </div>
    <div class="header-right">
      <span class="updated" id="updated"></span>
      <button class="toggle" id="themeToggle" aria-label="Toggle light and dark theme">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats"></section>

  <div class="section-head">
    <h2>Standings</h2>
    <div class="exports">
      <button class="btn" data-export="standings" data-fmt="json">JSON</button>
      <button class="btn" data-export="standings" data-fmt="csv">CSV</button>
    </div>
  </div>
  <section class="groups" id="groups">
    <div class="loading">Loading standings…</div>
  </section>

  <div class="section-head">
    <h2>Top Scorers</h2>
    <div class="exports">
      <button class="btn" data-export="scorers" data-fmt="json">JSON</button>
      <button class="btn" data-export="scorers" data-fmt="csv">CSV</button>
    </div>
  </div>
  <section class="scorers-card" id="scorers"></section>
</main>

<footer class="wrap">
  Data from <a href="https://github.com/openfootball/worldcup.json" target="_blank" rel="noopener">openfootball</a>. Updates about once a day. Not affiliated with FIFA.
</footer>

<script>
const state = { standings: [], scorers: [] };

async function load() {
  try {
    const [s, sc] = await Promise.all([
      fetch('output/standings.json').then(r => r.json()),
      fetch('output/scorers.json').then(r => r.json()),
    ]);
    state.standings = s;
    state.scorers = sc;
    renderStats();
    renderGroups();
    renderScorers();
    document.getElementById('updated').textContent =
      'Updated ' + new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  } catch (e) {
    document.getElementById('groups').innerHTML =
      '<div class="loading">Could not load data. Run the pipeline first to generate the output files, then serve this folder.</div>';
  }
}

function renderStats() {
  const s = state.standings;
  // Each match's goals counted once: sum goals_for across all teams.
  const totalGoals = s.reduce((a, r) => a + r.goals_for, 0);
  // Each match counts for 2 teams, so sum of "played" / 2.
  const played = Math.round(s.reduce((a, r) => a + r.played, 0) / 2);
  const totalMatches = 72;
  const gpm = played ? (totalGoals / played).toFixed(2) : '0';

  const cards = [
    { label: 'Total Goals', num: totalGoals, unit: 'across the group stage' },
    { label: 'Matches Played', num: played, unit: `of ${totalMatches} group games` },
    { label: 'Remaining', num: totalMatches - played, unit: 'group games left' },
    { label: 'Goals / Match', num: gpm, unit: 'group-stage average' },
  ];
  document.getElementById('stats').innerHTML = cards.map(c => `
    <div class="stat">
      <div class="label">${c.label}</div>
      <div class="num">${c.num}</div>
      <div class="unit">${c.unit}</div>
    </div>`).join('');
}

function renderGroups() {
  const byGroup = {};
  state.standings.forEach(r => (byGroup[r.group] ??= []).push(r));

  document.getElementById('groups').innerHTML = Object.keys(byGroup).sort().map(g => {
    const rows = byGroup[g].sort((a, b) => a.position - b.position);
    const body = rows.map(r => {
      const qualified = r.position <= 2 ? 'qualified' : '';
      const cutline = r.position === 2 ? 'cutline' : '';
      const gd = (r.goal_difference > 0 ? '+' : '') + r.goal_difference;
      return `<tr class="${qualified} ${cutline}">
        <td class="team-col"><span class="pos">${r.position}.</span>${r.team}</td>
        <td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td>
        <td>${gd}</td><td class="pts">${r.points}</td>
      </tr>`;
    }).join('');
    return `<div class="group-card">
      <div class="gc-head"><span class="name">${g}</span><span class="tag">Top 2 advance</span></div>
      <table>
        <thead><tr>
          <th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`;
  }).join('');
}

function renderScorers() {
  document.getElementById('scorers').innerHTML = state.scorers.map((r, i) => `
    <div class="scorer-row ${i === 0 ? 'lead' : ''}">
      <div class="rank">${r.rank}.</div>
      <div class="who"><div class="nm">${r.player}</div><div class="tm">${r.team}</div></div>
      <div class="goals">${r.goals}</div>
    </div>`).join('');
}

// Client-side export: build the file in the browser from loaded data.
function toCSV(records) {
  if (!records.length) return '';
  const keys = Object.keys(records[0]);
  const escape = v => `"${String(v).replace(/"/g, '""')}"`;
  return [keys.join(','), ...records.map(r => keys.map(k => escape(r[k])).join(','))].join('\n');
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

document.querySelectorAll('[data-export]').forEach(btn => {
  btn.addEventListener('click', () => {
    const which = btn.dataset.export;
    const fmt = btn.dataset.fmt;
    const data = which === 'standings' ? state.standings : state.scorers;
    if (fmt === 'json') {
      download(`${which}.json`, JSON.stringify(data, null, 2), 'application/json');
    } else {
      download(`${which}.csv`, toCSV(data), 'text/csv');
    }
  });
});

// Theme toggle with persistence
const root = document.documentElement;
const saved = localStorage.getItem('wc26-theme');
if (saved) root.setAttribute('data-theme', saved);
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('wc26-theme', next);
});

load();
</script>
</body>
</html>
