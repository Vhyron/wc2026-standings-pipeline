name: worldcup-workflow

on:
  schedule:
    - cron: "0 1 * * *"   # daily 01:00 UTC = 09:00 Philippine time
  workflow_dispatch: {}    # manual runs from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails the run if uv.lock is stale, instead of silently
      # re-resolving; the interpreter comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Write GCP credentials
        if: ${{ vars.WC_BQ_PROJECT != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"

      - name: Run pipeline
        env:
          WC_BQ_PROJECT: ${{ vars.WC_BQ_PROJECT }}
          WC_BQ_DATASET: ${{ vars.WC_BQ_DATASET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: uv run python pipeline.py
